openapi: 3.1.0
info:
  title: Expense Tracker API
  version: 0.1.0
  description: Versioned REST contract for the Expense Tracker. Financial and protected resources are added only after their decision gates are approved.
servers:
  - url: http://localhost:3001
    description: Disposable local development server
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: API health
      responses:
        '200':
          description: Healthy API process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/wallet/members:
    get:
      operationId: listWalletMembers
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active and revoked members visible to a wallet manager
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WalletMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/categories:
    get:
      operationId: listCategories
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Categories visible in the current Shared Wallet
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createCategory
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Admin-managed category created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/transfers:
    post:
      operationId: createTransfer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransferRequest' }
      responses:
        '201':
          description: Atomic linked debit and credit legs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/transactions/{transactionId}/attachments:
    post:
      operationId: uploadTransactionAttachment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentUploadRequest' }
      responses:
        '201':
          description: Attachment stored privately and awaiting malware scanning
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/attachments/{attachmentId}/download:
    get:
      operationId: downloadCleanAttachment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Private clean attachment bytes }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/wallet/roles:
    get:
      operationId: listWalletRoles
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Roles and explicit permissions for the current Shared Wallet
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WalletRole' }
    post:
      operationId: createWalletRole
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: Role created with exactly the requested explicit permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletRole' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/wallet/members/{memberId}/role:
    patch:
      operationId: assignWalletMemberRole
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId: { type: string, format: uuid }
      responses:
        '200': { description: Membership role updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/wallet/members/{memberId}/revoke:
    post:
      operationId: revokeWalletMember
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Membership revoked without deleting financial history }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing or invalid OIDC bearer token
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Forbidden:
      description: Authenticated identity lacks the required server-side permission
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    NotFound:
      description: Resource not found in the current Shared Wallet
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Conflict:
      description: Conflict, stale operation, or invalid transfer target
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, const: ok }
        service: { type: string, example: expense-tracker-api }
        version: { type: string, const: v1 }
    ApiError:
      type: object
      required: [code, message, requestId, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        retryable: { type: boolean }
        fields:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    SyncMetadata:
      type: object
      required: [operationId, baseVersion, schemaVersion]
      properties:
        operationId: { type: string, format: uuid }
        baseVersion: { type: integer, minimum: 0 }
        schemaVersion: { type: string }
        clientCreatedAt: { type: string, format: date-time }
    ConflictMetadata:
      type: object
      required: [aggregateId, serverVersion, attemptedOperationId]
      properties:
        aggregateId: { type: string }
        serverVersion: { type: integer, minimum: 0 }
        attemptedOperationId: { type: string, format: uuid }
        resolutionState: { type: string, enum: [unresolved] }
    WalletMember:
      type: object
      required: [userId, subject, email, displayName, roleId, roleName, status]
      properties:
        userId: { type: string, format: uuid }
        subject: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        roleId: { type: string, format: uuid }
        roleName: { type: string }
        status: { type: string, enum: [active, revoked] }
    Category:
      type: object
      required: [id, name, isSystem]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isSystem: { type: boolean }
    WalletRole:
      type: object
      required: [id, name, isSystem, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        isSystem: { type: boolean }
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
    CreateRoleRequest:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
    CreateTransferRequest:
      type: object
      required: [targetUserId, amountMinor, currency, amountMadMinor, exchangeRate, paymentMethod, transactionDate]
      properties:
        targetUserId: { type: string, format: uuid }
        amountMinor: { type: string, pattern: '^[0-9]+$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        amountMadMinor: { type: string, pattern: '^[0-9]+$' }
        exchangeRate: { type: string }
        rateTimestamp: { type: string, format: date-time }
        rateSource: { type: string }
        paymentMethod: { type: string, enum: [cash, card, bank_transfer, mobile_payment] }
        transactionDate: { type: string, format: date }
        note: { type: string }
    TransferResponse:
      type: object
      required: [transferGroupId, debit, credit]
      properties:
        transferGroupId: { type: string, format: uuid }
        debit: { $ref: '#/components/schemas/Transaction' }
        credit: { $ref: '#/components/schemas/Transaction' }
    Transaction:
      type: object
      required: [id, transactionType, amountMinor, currency, amountMadMinor, exchangeRate, paymentMethod, transactionDate, version]
      properties:
        id: { type: string, format: uuid }
        transactionType: { type: string, enum: [income, expense, refund, transfer_debit, transfer_credit] }
        amountMinor: { type: string }
        currency: { type: string }
        amountMadMinor: { type: string }
        exchangeRate: { type: string }
        paymentMethod: { type: string }
        transactionDate: { type: string, format: date }
        version: { type: integer, minimum: 1 }
    AttachmentUploadRequest:
      type: object
      required: [filename, contentBase64]
      properties:
        filename: { type: string, maxLength: 255 }
        contentBase64: { type: string, description: Base64-encoded JPG, PNG, or PDF bytes }
    Attachment:
      type: object
      required: [id, transactionId, contentType, sizeBytes, status]
      properties:
        id: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        contentType: { type: string, enum: [image/jpeg, image/png, application/pdf] }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        status: { type: string, enum: [pending, clean, quarantined, failed] }
