services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense_tracker
      POSTGRES_PASSWORD: ${DISPOSABLE_POSTGRES_PASSWORD:?set DISPOSABLE_POSTGRES_PASSWORD}
      KEYCLOAK_DB: keycloak
    ports:
      - '55432:5432'
    volumes:
      - expense-tracker-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/10-keycloak-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U expense_tracker -d expense_tracker']
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: start-dev --http-port=8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${DISPOSABLE_KEYCLOAK_ADMIN:?set DISPOSABLE_KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DISPOSABLE_KEYCLOAK_PASSWORD:?set DISPOSABLE_KEYCLOAK_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: expense_tracker
      KC_DB_PASSWORD: ${DISPOSABLE_POSTGRES_PASSWORD:?set DISPOSABLE_POSTGRES_PASSWORD}
    ports:
      - '58080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  expense-tracker-postgres:
